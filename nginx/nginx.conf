# ==============================================================================
# Hardened Nginx Core Configuration
# Reference: Section 4.2 & Section 15.2 of architettura_sicurezza_web.txt
# ==============================================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
    worker_connections 8192;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 1. Information Exposure Mitigation (Section 12.7 & 15.2)
    server_tokens off;
    ignore_invalid_headers on;
    underscores_in_headers off;

    # 2. Performance & Buffer Tuning (Anti Slowloris / Buffer Overflow)
    client_body_buffer_size      128k;
    client_max_body_size         2m;
    client_header_buffer_size    1k;
    large_client_header_buffers  4 8k;

    # 3. Timeouts (Strict timeouts to mitigate slow-and-low DoS)
    client_body_timeout   10s;
    client_header_timeout 10s;
    keepalive_timeout     15s;
    send_timeout          10s;

    # 4. Kernel / Socket Optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # 5. Gzip Compression (Safe settings)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # 6. Structured JSON Logging for SIEM / Centralized Logging (Section 14.1)
    log_format json_analytics escape=json '{'
        '"time_local":"$time_iso8601",'
        '"client_ip":"$remote_addr",'
        '"real_ip":"$http_cf_connecting_ip",'
        '"request_id":"$request_id",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"bytes_sent":$bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"ssl_protocol":"$ssl_protocol",'
        '"ssl_cipher":"$ssl_cipher"'
    '}';

    access_log /var/log/nginx/access_json.log json_analytics;
    error_log  /var/log/nginx/error.log warn;

    # 7. Rate Limiting Zones (Section 10)
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Include modular configuration files
    include /etc/nginx/conf.d/*.conf;
}
