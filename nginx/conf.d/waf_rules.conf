# ==============================================================================
# Nginx WAF / Scanner / Honeypot Defense (Section 8.4 & Section 15.0)
# ==============================================================================

# Block hidden files, dotfiles, and VCS metadata
location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
    return 404;
}

# Block sensitive extensions
location ~* \.(bak|config|sql|fla|psd|ini|log|sh|inc|swp|dist|env|old|orig|tar|gz|zip)$ {
    deny all;
    access_log off;
    log_not_found off;
    return 404;
}

# Block common vulnerability scanners and exploit paths
location ~* /(wp-admin|wp-login|xmlrpc\.php|phpmyadmin|pma|actuator|server-status|phpinfo|debug|console) {
    deny all;
    return 404;
}

# Block illegal/unwanted HTTP methods (Section 8.3)
if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) {
    return 405;
}
