# ==============================================================================
# Reverse Proxy Server Definition
# Reference: Section 4.2, Section 5.1 & Section 7 of architettura_sicurezza_web.txt
# ==============================================================================

upstream supernova_backend {
    server app:3001 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# 1. Default Server: Reject direct IP access and unknown Host headers (Section 4.2 & 5.1 Layer 4)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    ssl_reject_handshake on;
    server_name _;

    return 444; # Connection closed without response
}

# 2. HTTP to HTTPS Redirection
server {
    listen 80;
    listen [::]:80;
    server_name supernova.example.com *.supernova.example.com;

    return 301 https://$host$request_uri;
}

# 3. Main Production Origin Server
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name supernova.example.com;

    # TLS Architecture (Section 7)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # SSL Certificates (Cloudflare Origin CA / Private CA)
    ssl_certificate     /etc/nginx/certs/origin.crt;
    ssl_certificate_key /etc/nginx/certs/origin.key;

    # Authenticated Origin Pulls / mTLS (Section 5.1 Layer 2 & 7.1)
    # Enable when Cloudflare Authenticated Origin Pull CA is mounted:
    # ssl_client_certificate /etc/nginx/certs/cloudflare_origin_pull_ca.pem;
    # ssl_verify_client on;
    # ssl_verify_depth 2;

    # Include WAF rules & Security Headers
    include /etc/nginx/conf.d/security_headers.conf;
    include /etc/nginx/conf.d/waf_rules.conf;

    # Connection Limit per IP
    limit_conn conn_limit 20;

    # Reverse Proxy to Node.js App
    location / {
        limit_req zone=general_limit burst=30 nodelay;

        proxy_pass http://supernova_backend;
        proxy_http_version 1.1;

        # Hop-by-hop header cleanup
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        
        # Real IP / Forwarded headers
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;

        # Origin Verification Shared Secret (Optional defense-in-depth)
        proxy_set_header X-Origin-Verify $http_x_origin_verify;

        # Strict proxy timeouts
        proxy_connect_timeout 5s;
        proxy_send_timeout    15s;
        proxy_read_timeout    15s;
        proxy_buffering       on;
        proxy_buffers         8 16k;
        proxy_buffer_size     16k;
    }

    # Strict Rate Limit on Authentication Endpoints (Section 10.3)
    location ~* ^/api/auth/(login|register|change-password) {
        limit_req zone=auth_limit burst=5 nodelay;

        proxy_pass http://supernova_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
    }
}
